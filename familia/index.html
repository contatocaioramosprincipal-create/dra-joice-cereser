<style>
:root{--bg:#F3EDE4;--surface:#FFFDF9;--line:#E6DACB;--cafe:#2F211A;--caramelo:#A26B44;--oliva:#5B5A3C;--salvia:#DCE0D0;--argila:#D9A898;--ouro:#E3C59E;--texto:#5A463A;--mudo:#8A7566;
  --t-salvia:#E7EADD;--t-caramelo:#F4E6D7;--t-argila:#F5E4DC;--t-ouro:#F7EEDC;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#E9E1D5;color:var(--cafe);font:400 15px/1.5 "Jost",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.01em}
[hidden]{display:none!important}
.shell{max-width:480px;min-height:100dvh;margin:0 auto;background:var(--bg);position:relative;box-shadow:0 0 60px -30px rgba(47,33,26,.4)}
:focus-visible{outline:2px solid var(--caramelo);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:14px;padding:15px 18px;font:500 15px/1 "Jost";cursor:pointer;text-decoration:none;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn-p{background:var(--caramelo);color:#fff}
.btn-o{background:var(--oliva);color:#fff}
.btn-w{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.28)}
.btn-l{background:var(--surface);color:var(--cafe);border:1px solid var(--line)}
.btn-wa{background:#2F7D4E;color:#fff}
.full{width:100%}
/* login */
#login{min-height:100dvh;display:flex;flex-direction:column}
.lg-top{background:var(--oliva);color:#fff;padding:calc(56px + env(safe-area-inset-top,0px)) 28px 70px;border-radius:0 0 36px 36px;position:relative;overflow:hidden}
.lg-top::after{content:"";position:absolute;right:-60px;bottom:-90px;width:240px;height:240px;border-radius:50%;background:rgba(227,197,158,.14)}
.lg-top::before{content:"";position:absolute;right:40px;top:40px;width:90px;height:90px;border-radius:50%;background:rgba(162,107,68,.35)}
.mono{width:62px;height:62px;border-radius:18px;background:var(--caramelo);display:grid;place-items:center;font:500 22px/1 "Jost";color:#F7F3EE;position:relative;z-index:1;box-shadow:0 12px 24px -12px rgba(0,0,0,.5)}
.lg-top h1{font-size:30px;line-height:1.15;margin-top:26px;position:relative;z-index:1}
.lg-top p{color:rgba(255,255,255,.8);margin:10px 0 0;position:relative;z-index:1;max-width:22em}
.lg-card{margin:-38px 18px 0;background:var(--surface);border-radius:24px;padding:24px 22px;box-shadow:0 20px 40px -26px rgba(47,33,26,.45);position:relative;z-index:2}
.field{display:block;margin-bottom:14px}
.field span{display:block;font:500 11px/1 "Jost";letter-spacing:.14em;text-transform:uppercase;color:var(--mudo);margin-bottom:8px}
.field input{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:var(--bg);font-size:17px}
.field input:focus{outline:none;border-color:var(--caramelo);box-shadow:0 0 0 4px rgba(162,107,68,.14)}
.code{letter-spacing:.5em;text-align:center;font-weight:500}
.err{color:#9B3B2E;font-size:14px;min-height:20px;margin:6px 0}
.lg-foot{padding:24px 26px 40px;text-align:center;color:var(--mudo);font-size:14px}
.lg-foot a{color:var(--caramelo);font-weight:500}
/* app */
.hd{padding:calc(22px + env(safe-area-inset-top,0px)) 22px 8px;display:flex;align-items:center;justify-content:space-between}
.hd .dt{font:500 11px/1 "Jost";letter-spacing:.16em;text-transform:uppercase;color:var(--caramelo)}
.hd h1{font-size:26px;margin-top:6px}
.hd .mono{width:46px;height:46px;border-radius:14px;font-size:16px}
.view{padding:10px 18px calc(110px + env(safe-area-inset-bottom,0px))}
.next{background:var(--oliva);color:#fff;border-radius:24px;padding:22px;position:relative;overflow:hidden;margin-top:8px}
.next::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(227,197,158,.12)}
.next .lb{font:500 11px/1 "Jost";letter-spacing:.16em;text-transform:uppercase;color:var(--ouro)}
.next .when{font:500 26px/1.15 "Jost";margin-top:12px;position:relative;z-index:1}
.next .who{color:rgba(255,255,255,.82);margin-top:6px;font-size:14.5px}
.next .st{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font:500 12px/1 "Jost";padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.14)}
.next .st.ok{background:rgba(220,224,208,.25);color:#E9F0D5}
.next .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;position:relative;z-index:1}
.next .acts .btn{padding:13px 10px;font-size:14px}
.next .acts .btn.wide{grid-column:1/-1;background:var(--ouro);color:var(--cafe)}
.sect{margin-top:22px}
.sect h2{font-size:17px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.sect h2 a{font:400 13px/1 "Jost";color:var(--caramelo);text-decoration:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:0;border-radius:18px;padding:16px 12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:22px;text-decoration:none;color:var(--cafe);min-height:104px}
.tile svg{width:24px;height:24px}
.tile b{font:500 13.5px/1.25 "Jost"}
.tile:nth-child(1){background:var(--t-caramelo)}.tile:nth-child(1) svg{color:var(--caramelo)}
.tile:nth-child(2){background:var(--t-salvia)}.tile:nth-child(2) svg{color:var(--oliva)}
.tile:nth-child(3){background:var(--t-ouro)}.tile:nth-child(3) svg{color:#8A6A2A}
.tile:nth-child(4){background:var(--t-argila)}.tile:nth-child(4) svg{color:#9B4A35}
.tile:nth-child(5){background:#E2ECEF}.tile:nth-child(5) svg{color:#1A6A86}
.tile:nth-child(6){background:var(--surface);border:1px solid var(--line)}.tile:nth-child(6) svg{color:#2F7D4E}
.kid{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left}
.kid .av{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font:500 17px/1 "Jost";background:var(--t-salvia);color:var(--oliva);flex:none}
.kid .av.F{background:var(--t-argila);color:#9B4A35}.kid .av.M{background:#E2ECEF;color:#1A6A86}
.kid b{display:block;font:500 16px/1.3 "Jost"}
.kid small{color:var(--mudo);font-size:13px}
.kid .go{margin-left:auto;color:var(--mudo)}
.obs{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.obs .h{font:500 11px/1 "Jost";letter-spacing:.16em;text-transform:uppercase;color:var(--oliva);margin-bottom:10px}
.obs li{margin:8px 0;font-size:14.5px}
.obs ul{padding-left:18px;margin:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:22px;text-align:center;color:var(--mudo);font-size:14.5px}
/* filhos */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;cursor:pointer;font:500 14px/1 "Jost";color:var(--texto)}
.chips button[aria-pressed="true"]{background:var(--oliva);border-color:var(--oliva);color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:14px;margin:14px 0}
.seg button{border:0;background:none;padding:11px;border-radius:10px;cursor:pointer;font:500 14px/1 "Jost";color:var(--texto)}
.seg button[aria-pressed="true"]{background:var(--caramelo);color:#fff}
.gc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 12px 6px;margin-bottom:12px;position:relative}
.gc h4{font:500 15px/1.3 "Jost";margin:0 4px 2px}
.gc .sub{font-size:13px;color:var(--mudo);margin:0 4px 6px}
.gc .sub b{color:var(--caramelo);font-weight:500}
.gc svg{width:100%;height:auto;display:block}
.note{font-size:12.5px;color:var(--mudo);margin-top:10px;line-height:1.5}
.ages{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.ages::-webkit-scrollbar{display:none}
.ages button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;cursor:pointer;font:400 13px/1 "Jost";color:var(--texto)}
.ages button[aria-pressed="true"]{background:var(--oliva);color:#fff;border-color:var(--oliva)}
.dom{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px 10px;margin-top:10px}
.dom h5{font:500 14px/1 "Jost";color:var(--oliva);margin:14px 0 4px}
.it{padding:12px 0;border-top:1px solid var(--line);font-size:14.5px}
.dom h5+.it{border-top:0}
.ans{display:flex;gap:6px;margin-top:9px}
.ans button{flex:1;border:1px solid var(--line);background:var(--bg);padding:9px 6px;border-radius:10px;cursor:pointer;font:500 12.5px/1 "Jost";color:var(--texto)}
.ans button[aria-pressed="true"][data-v="sim"]{background:var(--oliva);color:#fff;border-color:var(--oliva)}
.ans button[aria-pressed="true"][data-v="nao"]{background:var(--caramelo);color:#fff;border-color:var(--caramelo)}
.ans button[aria-pressed="true"][data-v="ns"]{background:#8A7566;color:#fff;border-color:#8A7566}
.prog{display:flex;align-items:center;gap:12px;background:var(--t-salvia);border-radius:16px;padding:14px 16px;margin-top:12px;font-size:14px}
.prog .bar{flex:1;height:8px;border-radius:9px;background:rgba(91,90,60,.15);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--oliva);border-radius:9px}
/* conteúdos */
.art{display:block;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:10px;text-decoration:none}
.art small{font:500 10.5px/1 "Jost";letter-spacing:.16em;text-transform:uppercase;color:var(--oliva)}
.art b{display:block;font:500 16px/1.3 "Jost";margin-top:8px}
.art span{display:block;font-size:13px;color:var(--mudo);margin-top:6px}
.art.hl{background:var(--caramelo);border:0;color:#fff}.art.hl small{color:var(--ouro)}.art.hl span{color:rgba(255,255,255,.8)}
/* contato */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;text-align:center}
.doc .mono{margin:0 auto}
.doc h2{font-size:20px;margin-top:14px}
.doc p{color:var(--mudo);margin:6px 0 0;font-size:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;margin-top:12px;overflow:hidden}
.list a,.list button{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border:0;background:none;border-top:1px solid var(--line);text-decoration:none;cursor:pointer;font:400 15px/1.3 "Jost";text-align:left}
.list>:first-child{border-top:0}
.list svg{width:20px;height:20px;color:var(--caramelo);flex:none}
.list small{display:block;color:var(--mudo);font-size:12.5px}
/* barra inferior */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);background:rgba(255,253,249,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font:500 11px/1 "Jost";color:var(--mudo);padding:7px 4px;border-radius:14px;cursor:pointer}
.tabbar svg{width:23px;height:23px}
.tabbar button[aria-current="page"]{color:var(--caramelo);background:var(--t-caramelo)}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--oliva);color:#fff;padding:13px 20px;border-radius:999px;font-size:14px;opacity:0;transition:all .3s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.skel{background:linear-gradient(90deg,rgba(47,33,26,.05),rgba(47,33,26,.09),rgba(47,33,26,.05));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:20px;height:180px}
@keyframes sk{to{background-position:-200% 0}}
.fade{animation:fd .35s ease both}@keyframes fd{from{opacity:0;transform:translateY(6px)}}
</style>
</head>

function isoDay(d){var p=parts(d);return p.year+'-'+p.month+'-'+p.day}
function dayObj(i){return new Date(i+'T12:00:00Z')}

function ageMonths(b,at){var a=at?dayObj(at):dayObj(isoDay(new Date()));return (a-dayObj(b))/86400000/30.4375}

function lmsAt(t,m){m=Math.max(0,Math.min(60,m));var i=Math.floor(m),f=m-i,a=t[i],b=t[Math.min(60,i+1)];return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f]}
function valAt(t,m,z){var q=lmsAt(t,m),L=q[0],Mm=q[1],S=q[2];return Math.abs(L)<1e-6?Mm*Math.exp(S*z):Mm*Math.pow(1+L*S*z,1/L)}
function gChart(el,tab,pts,title,unit,age){
  var maxM=Math.min(60,Math.max(12,Math.ceil(Math.max(age,pts.length?pts[pts.length-1].m:0)/6)*6+3));
  var W=360,H=220,pl=30,pr=10,pt=10,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  var lo=valAt(tab,0,-2.3),hi=valAt(tab,maxM,2.3);pts.forEach(function(p){lo=Math.min(lo,p.v);hi=Math.max(hi,p.v)});
  var rng=hi-lo,step=rng>60?10:rng>25?5:rng>10?2:1;lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  function x(m){return pl+m/maxM*iw}function y(v){return pt+ih-(v-lo)/(hi-lo)*ih}
  function band(z1,z2){var a=[],b=[];for(var m=0;m<=maxM+1e-9;m+=.5){a.push(x(m).toFixed(1)+' '+y(valAt(tab,m,z1)).toFixed(1));b.unshift(x(m).toFixed(1)+' '+y(valAt(tab,m,z2)).toFixed(1))}return 'M'+a.join('L')+'L'+b.join('L')+'Z'}
  function line(z){var d='';for(var m=0;m<=maxM+1e-9;m+=.5)d+=(d?'L':'M')+x(m).toFixed(1)+' '+y(valAt(tab,m,z)).toFixed(1);return d}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(title)+'"><g font-family="Jost" font-size="9.5" fill="#8A7566">';
  for(var v=lo;v<=hi+1e-9;v+=step*(rng>20?2:1)){s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#EFE7DC"/><text x="'+(pl-5)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'</text>'}
  var xs=maxM<=24?6:12;for(var m=0;m<=maxM;m+=xs)s+='<text x="'+x(m)+'" y="'+(H-8)+'" text-anchor="middle">'+(m<24?m+'m':m/12+'a')+'</text>';
  s+='</g><path d="'+band(-1.881,1.881)+'" fill="#E7EADD"/><path d="'+band(-1.036,1.036)+'" fill="#D9DECB"/><path d="'+line(0)+'" fill="none" stroke="#5B5A3C" stroke-width="1.5"/>';
  if(pts.length>1)s+='<path d="'+pts.map(function(p,i){return (i?'L':'M')+x(p.m).toFixed(1)+' '+y(p.v).toFixed(1)}).join('')+'" fill="none" stroke="#A26B44" stroke-width="2.2" stroke-linejoin="round"/>';
  pts.forEach(function(p){s+='<circle cx="'+x(p.m)+'" cy="'+y(p.v)+'" r="4.5" fill="#A26B44" stroke="#fff" stroke-width="1.8"/>'});
  var last=pts[pts.length-1];
  el.innerHTML='<h4>'+esc(title)+'</h4><div class="sub">'+(last?'Última medida: <b>'+String(last.v).replace('.',',')+' '+unit+'</b> em '+dayObj(last.d).toLocaleDateString('pt-BR',{timeZone:'UTC'}):'Sem medidas ainda')+'</div>'+s+'</svg>';
}
