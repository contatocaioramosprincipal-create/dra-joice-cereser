<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Relatório de resultados · Dra. Joice Cereser</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap">
<style>
@page{size:A4;margin:0}
:root{--linho:#F5EDE2;--areia:#EADBC6;--papel:#FBF6EF;--cafe:#2F211A;--caramelo:#A26B44;--oliva:#5B5A3C;--salvia:#DCE0D0;--argila:#D9A898;--ouro:#E3C59E;--texto:#5A463A;--mudo:#8A7566;--c1:#B0652C;--c2:#1A7BA0;--c3:#6E7A22;--c4:#C2607A;--c5:#7A55A8}
*{box-sizing:border-box}
body{margin:0;background:#d9cfc3;font:300 10.5pt/1.55 Jost,sans-serif;color:var(--cafe);-webkit-print-color-adjust:exact;print-color-adjust:exact}
h1,h2{font-family:"Cormorant Garamond",serif;font-weight:400;margin:0;line-height:1.05}
em{font-style:italic;color:var(--caramelo)}
.bar-top{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:12px;padding:14px;background:rgba(47,33,26,.92)}
.bar-top button,.bar-top a{border:0;border-radius:999px;padding:12px 22px;font:500 12px/1 Jost;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.bar-top .p{background:var(--ouro);color:var(--cafe)}.bar-top .g{background:transparent;color:var(--linho);border:1px solid rgba(245,237,226,.35)}
.pg{width:210mm;min-height:297mm;margin:18px auto;background:var(--linho);position:relative;overflow:hidden;padding:18mm 17mm 22mm;box-shadow:0 20px 50px -20px rgba(0,0,0,.4)}
.ey{font:500 7.4pt/1 Jost;letter-spacing:.3em;text-transform:uppercase;color:var(--caramelo);display:flex;align-items:center;gap:9px}
.ey::before{content:"";width:22px;height:1px;background:currentColor;opacity:.6}
.head{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px}.logo svg{width:34px;height:34px;color:var(--caramelo)}
.logo b{font:400 26pt/1 "Pinyon Script";display:block}.logo small{font:500 6.6pt/1 Jost;letter-spacing:.36em;text-transform:uppercase;color:var(--caramelo)}
.per{text-align:right;font-size:9pt;color:var(--mudo)}.per b{display:block;font:400 15pt/1.1 "Cormorant Garamond";color:var(--cafe)}
.hero{margin-top:12mm;background:var(--oliva);color:var(--linho);border-radius:16px;padding:10mm 10mm 9mm;position:relative;overflow:hidden}
.hero .ey{color:var(--ouro)}
.hero h1{font-size:25pt;margin-top:4mm;max-width:150mm}.hero h1 b{font-weight:500;color:var(--ouro)}
.hero p{margin:4mm 0 0;color:rgba(245,237,226,.8);max-width:150mm}
.hero svg{position:absolute;right:-20mm;bottom:-40mm;width:90mm;opacity:.3}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin-top:6mm}
.k{background:var(--papel);border:1px solid rgba(47,33,26,.1);border-radius:12px;padding:5mm 5mm 4mm}
.k .l{font:500 6.8pt/1.2 Jost;letter-spacing:.2em;text-transform:uppercase;color:var(--mudo)}
.k .v{font:400 26pt/1 "Cormorant Garamond";margin-top:3mm}
.k .d{font-size:8pt;color:var(--mudo);margin-top:2mm}.k .d.up{color:#4B6B2A}.k .d.down{color:#9B3B2E}
.k.dark{background:var(--cafe);color:var(--linho);border:0}.k.dark .v{color:var(--ouro)}.k.dark .l,.k.dark .d{color:rgba(245,237,226,.65)}
.sec{margin-top:7mm}
.sec h2{font-size:17pt;margin-bottom:3mm}
.two{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
.box{background:var(--papel);border:1px solid rgba(47,33,26,.1);border-radius:12px;padding:5mm}
.rows div{display:grid;grid-template-columns:30mm 1fr 18mm;gap:3mm;align-items:center;margin-top:2.4mm;font-size:9pt}
.rows .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .tr{height:2.4mm;border-radius:9px;background:rgba(47,33,26,.07);overflow:hidden}.rows .tr i{display:block;height:100%;border-radius:9px}
.rows .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--texto)}
.fun{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;align-items:end;height:38mm}
.fun div{display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center;font-size:8pt;color:var(--mudo)}
.fun b{font:400 15pt/1 "Cormorant Garamond";color:var(--cafe);margin-bottom:1.5mm}
.fun i{display:block;border-radius:6px 6px 2px 2px;background:var(--caramelo);margin-bottom:1.5mm}
.chart svg{width:100%;height:auto;display:block}
.foot{position:absolute;left:17mm;right:17mm;bottom:9mm;display:flex;justify-content:space-between;font-size:7pt;letter-spacing:.16em;text-transform:uppercase;color:var(--mudo)}
.foot b{color:var(--oliva);font-weight:500}
.note{font-size:8.4pt;color:var(--mudo);margin-top:3mm}
.empty{color:var(--mudo);font-style:italic;font-size:9pt;padding:3mm 0}
.load{text-align:center;padding:80px;font:italic 400 22px "Cormorant Garamond";color:var(--cafe)}
@media print{body{background:none}.bar-top{display:none}.pg{margin:0;box-shadow:none;page-break-after:always;height:297mm}.pg:last-child{page-break-after:auto}}
</style></head><body>
<div class="bar-top"><button class="p" onclick="print()">Salvar em PDF / imprimir</button><a class="g" href="/painel/">Voltar ao painel</a></div>
<div id="out"><div class="load">Montando o relatório…</div></div>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="i-bear" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="16" cy="17" r="7"/><circle cx="48" cy="17" r="7"/><circle cx="32" cy="35" r="20"/><ellipse cx="32" cy="43" rx="8" ry="6"/></g><circle cx="24.5" cy="32" r="1.8" fill="currentColor"/><circle cx="39.5" cy="32" r="1.8" fill="currentColor"/></symbol></defs></svg>
<script>
(function(){
var SB='https://phjhedoavxicpsvuxmls.supabase.co',KEY='sb_publishable_3luHSKJnQcijOLhelysNxA_bYwnqTB1';
var SEC={topo:'Menu do topo',inicio:'Abertura',manifesto:'Frase de destaque',sobre:'Sobre mim',atendimento:'Como eu atendo',sinais:'Sinais de atenção',primeira:'Primeira consulta',acompanho:'O que eu acompanho',formacao:'Formação',vida:'Fora do consultório',duvidas:'Dúvidas frequentes',leituras:'Conteúdos',agendar:'Agendamento',rodape:'Rodapé'};
var tk;try{tk=localStorage.getItem('jc_token')}catch(e){}
var q=new URLSearchParams(location.search),from=q.get('from'),to=q.get('to');
function rpc(fn,b){return fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){if(!r.ok)throw new Error('Sessão expirada. Entre no painel de novo.');return r.json()})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function nf(n){return (n||0).toLocaleString('pt-BR')}
function dur(ms){var s=Math.round((ms||0)/1000);if(s<60)return s+'s';return Math.floor(s/60)+'min'+(s%60?' '+s%60+'s':'')}
function fd(iso,o){return new Date(iso+'T12:00:00Z').toLocaleDateString('pt-BR',Object.assign({timeZone:'UTC'},o||{day:'numeric',month:'long',year:'numeric'}))}
function dl(c,p){if(!p&&!c)return '<div class="d">sem dados anteriores</div>';if(!p)return '<div class="d up">novo no período</div>';var v=Math.round((c-p)/p*100);return '<div class="d '+(v>0?'up':v<0?'down':'')+'">'+(v>0?'↑ ':v<0?'↓ ':'')+Math.abs(v)+'% vs período anterior</div>'}
function rows(list,lab,val,col){if(!list.length)return '<div class="empty">Ainda sem dados neste período.</div>';var mx=Math.max.apply(null,list.map(val))||1;return '<div class="rows">'+list.map(function(x,i){var lb=String(lab(x)||'');lb=lb.charAt(0).toUpperCase()+lb.slice(1);return '<div><span class="t">'+esc(lb)+'</span><span class="tr"><i style="width:'+(val(x)/mx*100)+'%;background:'+(col?col(i):'var(--caramelo)')+'"></i></span><span class="n">'+val.fmt(x)+'</span></div>'}).join('')+'</div>'}
function chart(data){if(!data.length)return '';var W=560,H=150,pl=26,pb=20,pt=8,iw=W-pl-6,ih=H-pt-pb,n=data.length,mx=Math.max(4,Math.max.apply(null,data.map(function(d){return d.visitors})));
  function x(i){return pl+(n===1?iw/2:i/(n-1)*iw)}function y(v){return pt+ih-v/mx*ih}
  var s='<svg viewBox="0 0 '+W+' '+H+'"><g font-family="Jost" font-size="8" fill="#8A7566">';[0,.5,1].forEach(function(f){var v=Math.round(mx*f);s+='<line x1="'+pl+'" x2="'+W+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="rgba(47,33,26,.1)"/><text x="'+(pl-5)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'</text>'});
  var ev=Math.ceil(n/6);data.forEach(function(d,i){if(i%ev===0)s+='<text x="'+x(i)+'" y="'+(H-5)+'" text-anchor="middle">'+fd(d.day,{day:'2-digit',month:'2-digit'})+'</text>'});s+='</g>';
  var ln=data.map(function(d,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(d.visitors).toFixed(1)}).join(' ');
  s+='<path d="'+ln+' L'+x(n-1)+' '+y(0)+' L'+x(0)+' '+y(0)+'Z" fill="rgba(162,107,68,.16)"/><path d="'+ln+'" fill="none" stroke="#A26B44" stroke-width="1.8" stroke-linejoin="round"/>';
  data.forEach(function(d,i){if(d.leads)s+='<circle cx="'+x(i)+'" cy="'+y(d.leads)+'" r="3.2" fill="#5B5A3C" stroke="#FBF6EF" stroke-width="1.2"/>'});return s+'</svg>'}
if(!tk||!from||!to){document.getElementById('out').innerHTML='<div class="load">Abra este relatório pelo painel.</div>';return}
Promise.all([rpc('joice_report',{p_token:tk,p_from:from,p_to:to,p_device:null}),rpc('joice_leads_summary',{p_token:tk,p_from:from,p_to:to})]).then(function(a){
  var R=a[0],L=a[1],K=R.kpis,tot=K.sessions||0,conv=tot?Math.round(K.leads/tot*1000)/10:0,pconv=K.p_sessions?Math.round(K.p_leads/K.p_sessions*1000)/10:0;
  var bs=L.by_status||{},ag=(bs.agendado||0)+(bs.compareceu||0);
  var secs=(R.sections||[]).slice().sort(function(a,b){return b.avg_s-a.avg_s}).slice(0,6);
  var src=(R.sources||[]).slice(0,5),D=R.depth||{},pd=function(k){return D.total?Math.round((D[k]||0)/D.total*100):0};
  var per=fd(from)+' a '+fd(to);
  var head='<div class="head"><div class="logo"><svg><use href="#i-bear"/></svg><div><b>Joice Cereser</b><small>Pediatria · relatório do site</small></div></div><div class="per">Período<b>'+per+'</b></div></div>';
  var foot=function(n){return '<div class="foot"><span>drajoice.com.br · Relatório de resultados</span><span>Preparado por <b>AXIS</b> · '+n+'/2</span></div>'};
  var p1='<section class="pg">'+head+
   '<div class="hero"><svg viewBox="0 0 300 300" fill="none" stroke="#E3C59E" stroke-width="1.4"><path d="M30 300V170a120 120 0 0 1 240 0V300"/><path d="M60 300V175a90 90 0 0 1 180 0V300"/><path d="M90 300V180a60 60 0 0 1 120 0V300"/></svg><div class="ey">Resumo do período</div>'+
   '<h1><b>'+nf(K.visitors)+'</b> '+(K.visitors===1?'família visitou':'famílias visitaram')+' o site, <b>'+nf(L.total)+'</b> '+(L.total===1?'fez um pedido':'fizeram pedidos')+' e <b>'+nf(ag)+'</b> '+(ag===1?'consulta foi agendada':'consultas foram agendadas')+'.</h1>'+
   '<p>Cada visita durou em média '+dur(K.avg_dur)+', e as famílias leram cerca de '+(K.avg_depth||0)+'% da página. '+(secs[0]?'A parte mais lida foi "'+esc(SEC[secs[0].section]||secs[0].section)+'".':'')+'</p></div>'+
   '<div class="kpis"><div class="k"><div class="l">Visitantes</div><div class="v">'+nf(K.visitors)+'</div>'+dl(K.visitors,K.p_visitors)+'</div>'+
   '<div class="k dark"><div class="l">Pedidos pelo site</div><div class="v">'+nf(L.total)+'</div>'+dl(L.total,L.p_total)+'</div>'+
   '<div class="k"><div class="l">Consultas agendadas</div><div class="v">'+nf(ag)+'</div><div class="d">'+nf(bs.compareceu||0)+' já compareceram</div></div>'+
   '<div class="k"><div class="l">Cliques para agendar</div><div class="v">'+nf(K.leads)+'</div>'+dl(K.leads,K.p_leads)+'</div>'+
   '<div class="k"><div class="l">Tempo médio de visita</div><div class="v">'+dur(K.avg_dur)+'</div>'+dl(K.avg_dur,K.p_avg_dur)+'</div>'+
   '<div class="k"><div class="l">Visitas que viram agendamento</div><div class="v">'+String(conv).replace('.',',')+'%</div>'+dl(conv,pconv)+'</div></div>'+
   '<div class="sec"><h2>Visitas <em>dia a dia</em></h2><div class="box chart">'+chart(R.daily||[])+'<div class="note">Linha: famílias diferentes por dia. Pontos: cliques para agendar.</div></div></div>'+
   '<div class="sec two"><div><h2>De onde <em>vieram</em></h2><div class="box">'+rows(src,function(x){return x.source},Object.assign(function(x){return x.n},{fmt:function(x){return nf(x.n)}}),function(i){return 'var(--c'+(i+1)+')'})+'</div></div>'+
   '<div><h2>Funil de <em>pedidos</em></h2><div class="box"><div class="fun">'+[['Pedidos',L.total],['Contatados',(bs.contatado||0)+ag],['Agendados',ag],['Compareceram',bs.compareceu||0]].map(function(f,i){var m=Math.max(L.total,1);return '<div><b>'+nf(f[1])+'</b><i style="height:'+Math.max(f[1]/m*26,1)+'mm;opacity:'+(1-i*.18)+'"></i>'+f[0]+'</div>'}).join('')+'</div></div></div></div>'+
   foot(1)+'</section>';
  var p2='<section class="pg">'+head+
   '<div class="sec two" style="margin-top:12mm"><div><h2>O que mais <em>prende a atenção</em></h2><div class="box">'+rows(secs,function(x){return SEC[x.section]||x.section},Object.assign(function(x){return x.avg_s},{fmt:function(x){return String(x.avg_s).replace('.',',')+'s'}}))+'</div></div>'+
   '<div><h2>Até onde <em>leem</em></h2><div class="box"><div class="fun">'+[['Início','d25'],['Metade','d50'],['Quase tudo','d75'],['Até o fim','d100']].map(function(f){var p=pd(f[1]);return '<div><b>'+p+'%</b><i style="height:'+Math.max(p*.26,1)+'mm"></i>'+f[0]+'</div>'}).join('')+'</div></div></div></div>'+
   '<div class="sec two"><div><h2>Motivos <em>da procura</em></h2><div class="box">'+rows(L.by_reason||[],function(x){return x.reason},Object.assign(function(x){return x.n},{fmt:function(x){return nf(x.n)}}),function(i){return 'var(--c'+(i%5+1)+')'})+'</div></div>'+
   '<div><h2>Cidades</h2><div class="box">'+rows((R.cities||[]).slice(0,6),function(x){return x.city+(x.region?' · '+x.region:'')},Object.assign(function(x){return x.n},{fmt:function(x){return nf(x.n)}}))+'</div></div></div>'+
   '<div class="sec two"><div><h2>Aparelhos</h2><div class="box">'+rows(R.devices||[],function(x){return x.device},Object.assign(function(x){return x.n},{fmt:function(x){return Math.round(x.n/Math.max(tot,1)*100)+'%'}}),function(i){return 'var(--c'+(i+1)+')'})+'</div></div>'+
   '<div><h2>O que mais <em>clicaram</em></h2><div class="box">'+rows((R.targets||[]).slice(0,6),function(x){return x.target},Object.assign(function(x){return x.n},{fmt:function(x){return nf(x.n)}}))+'</div></div></div>'+
   '<div class="sec"><div class="box" style="background:var(--salvia);border:0"><div class="ey" style="color:var(--oliva)">Como ler este relatório</div><p style="margin:3mm 0 0;font-size:9.4pt;color:var(--texto)">Os números vêm das estatísticas próprias do site, que são anônimas e não usam cookies. "Pedidos" são as famílias que pediram consulta ou baixaram o guia pelo site. "Agendados" e "compareceram" dependem da atualização das etapas na aba Pedidos do painel.</p></div></div>'+
   foot(2)+'</section>';
  document.getElementById('out').innerHTML=p1+p2;document.title='Relatório '+fd(from,{day:'2-digit',month:'2-digit'})+' a '+fd(to,{day:'2-digit',month:'2-digit',year:'numeric'})+' · Dra. Joice Cereser';
}).catch(function(e){document.getElementById('out').innerHTML='<div class="load">'+esc(e.message)+'</div>'});
})();
</script>
</body></html>
